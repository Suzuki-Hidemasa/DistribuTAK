syntax = "proto3";
package distributak.core;
option java_package = "io.github.hidemas_suzuki_aka_ziek.distributak.core.proto";
option java_outer_classname = "AdminRecordSchema";

// 第3段の案。全項目を明示し、番号順・最短の整数で書く。
// 一覧の repeated bytes は符号なし辞書順、同じ値は1つだけ。空の一覧は項目6なし。
// 時刻は Unix epoch milliseconds。uint64 は Java の非負の long の範囲。
// kind: 証明書=1、管理者=2、失効=3、包んだ鍵=4。
message SignedRecord { bytes payload = 1; bytes signature = 2; }
message Certificate {
  uint32 kind = 1; bytes group_id = 2; bytes signer = 3;
  uint64 version = 4; uint64 signed_at = 5;
  bytes identity_key = 6; bytes handshake_key = 7; bytes identity_signature = 8;
  uint64 issued_at = 9; uint64 expires_at = 10;
  uint32 format = 15; bytes purpose = 16; uint32 identity_proof_format = 17;
}
message AdministratorList {
  uint32 kind = 1; bytes group_id = 2; bytes signer = 3;
  uint64 version = 4; uint64 signed_at = 5; repeated bytes admin_keys = 6; repeated AdminBinding bindings = 7;
  uint32 format = 15; bytes purpose = 16;
}
message RevocationList {
  uint32 kind = 1; bytes group_id = 2; bytes signer = 3;
  uint64 version = 4; uint64 signed_at = 5; repeated bytes member_ids = 6;
  uint32 format = 15; bytes purpose = 16;
}
message WrappedGroupKey {
  uint32 kind = 1; bytes group_id = 2; bytes signer = 3;
  uint64 version = 4; uint64 signed_at = 5;
  bytes recipient_id = 6; bytes handshake_key = 7; bytes enc = 8; bytes ciphertext = 9;
  uint32 format = 15; bytes purpose = 16; bytes announcement_digest = 17;
}

// 告知の署名は KEY_ROTATION の既存の用途で包む。
// Announcement signatures use the existing KEY_ROTATION purpose.
message KeyAnnouncement {
  uint32 schema = 1; bytes group_id = 2; bytes signer = 3;
  uint64 key_version = 4; uint64 signed_at = 5; uint64 revocation_version = 6;
  bytes revocation_digest = 7; bytes key_commitment = 8;
  uint64 admin_version = 9; bytes admin_digest = 10;
}

message AdminBinding { bytes admin_key=1; uint32 state=2; bytes member_id=3; bytes possession_proof=4; }

// SPDX-License-Identifier: GPL-3.0-only
plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}
group = 'io.github.hidemas_suzuki_aka_ziek.distributak'
version = '0.1.0'
repositories { mavenCentral() }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
layout.buildDirectory = file('../out/distributak/build')
dependencies {
    api 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    generateProtoTasks { all().configureEach { builtins { java { option 'lite' } } } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def vectors = tasks.register('fetchVectors', Exec) {
    commandLine 'python3', file('tools/fetch-vectors.py')
}
test {
    dependsOn vectors
    useJUnitPlatform()
    systemProperty 'distributak.vectors', file('../out/distributak/vectors').absolutePath
}
// 手で動かす模擬（JUnit には数えない）。例: ./build.sh sim -PsimArgs="nodes=4096 seed=1" -PsimHeap=2g
tasks.register('sim', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.hidemas_suzuki_aka_ziek.distributak.core.dht.DhtSimMain'
    maxHeapSize = (project.findProperty('simHeap') ?: '1g')
    args = (project.findProperty('simArgs') ?: '').toString().split(' ').findAll { it }
}
